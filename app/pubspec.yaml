name: glowbook
description: "Glowbook — premium booking & management for beauty salons."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking + storage (tokens live in the platform keystore, never in prefs)
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Presentation
  google_fonts: ^6.2.1
  intl: any
  fl_chart: ^0.69.0
  # Salon-local times regardless of the device's timezone.
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
